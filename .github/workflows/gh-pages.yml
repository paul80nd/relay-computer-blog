name: github pages

on:
  push:
    branches:
      - main  # Set a branch to deploy
  pull_request:

env:
  HUGO_ENV: production

# Least-privilege GITHUB_TOKEN: the deploy step (peaceiris/actions-gh-pages)
# pushes the built site to the gh-pages branch, which requires contents: write.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install

      - name: Install Dart Sass
        run: npm install -g sass-embedded

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
