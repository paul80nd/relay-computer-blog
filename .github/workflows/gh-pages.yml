name: github pages

on:
  push:
    branches:
      - main  # Set a branch to deploy
  pull_request:

env:
  HUGO_ENV: production

# Least-privilege GITHUB_TOKEN: the deploy step (peaceiris/actions-gh-pages)
# pushes the built site to the gh-pages branch, which requires contents: write.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install

      # Dart Sass (sass-embedded) is a pinned devDependency; expose its
      # native binary on PATH so Hugo's dartsass transpiler can find it.
      # Not node_modules/.bin: npm may also install the pure-JS `sass`
      # package, whose `sass` bin shadows it and has no --embedded mode.
      - name: Make Dart Sass available to Hugo
        run: echo "$PWD/node_modules/sass-embedded-linux-x64/dart-sass" >> "$GITHUB_PATH"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: Build
        run: hugo --minify --cleanDestinationDir

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
